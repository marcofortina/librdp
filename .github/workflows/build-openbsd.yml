            openssl_package="$(pkg_info -Q openssl | grep '^openssl-3\.' | LC_ALL=C sort | tail -n 1)"
            python_package="$(pkg_info -Q python | grep '^python-3\.' | LC_ALL=C sort | tail -n 1)"
            test -n "${openssl_package}"
            test -n "${python_package}"
            pkg_add "${openssl_package}" "${python_package}"
