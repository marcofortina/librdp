            fi
          run: |
            openssl_config="$(find /usr/local/lib -path '*/cmake/OpenSSL/OpenSSLConfig.cmake' -print | LC_ALL=C sort | tail -n 1)"
            test -n "${openssl_config}"
            openssl_cmake_dir="${openssl_config%/OpenSSLConfig.cmake}"
            test -f "${openssl_cmake_dir}/OpenSSLConfigVersion.cmake"
            openssl_header="$(find /usr/local -path '*/include/eopenssl*/openssl/types.h' -print | LC_ALL=C sort | tail -n 1)"
            test -n "${openssl_header}"
            export OPENSSL_INCLUDE_DIR="${openssl_header%/openssl/types.h}"
            cmake -S . -B build-openbsd-core-no-backends -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON \
              -DOpenSSL_DIR="${openssl_cmake_dir}" \
              -DOPENSSL_INCLUDE_DIR="${OPENSSL_INCLUDE_DIR}" \
              -DLIBRDP_OPENSSL_INCLUDE_DIR="${OPENSSL_INCLUDE_DIR}" \
              -DCMAKE_PREFIX_PATH=/usr/local \
              -DLIBRDP_BUILD_TESTS=ON \
              -DLIBRDP_BUILD_EXAMPLES=ON \
              -DLIBRDP_BUILD_VIEWER=OFF \
