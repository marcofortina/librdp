name: build-netbsd

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netbsd-x11-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test X11 applications in NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            export PKG_PATH="https://ftp.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r)/All/"
            xsets_url="https://cdn.NetBSD.org/pub/NetBSD/NetBSD-$(uname -r)/$(uname -m)/binary/sets"
            for set_name in xbase xcomp xfont xserver; do
              set_archive="/tmp/${set_name}.tar.xz"
              ftp -o "${set_archive}" "${xsets_url}/${set_name}.tar.xz"
              tar -xJpf "${set_archive}" -C /
            done
            pkg_add \
              cmake ninja-build pkgconf openssl libiconv python312 \
              libXcursor libxkbcommon
            if command -v python3.12 >/dev/null 2>&1 && ! command -v python3 >/dev/null 2>&1; then
              ln -sf /usr/pkg/bin/python3.12 /usr/pkg/bin/python3
            fi
            test -f /usr/X11R7/include/X11/Xlib.h
          run: |
            export PKG_CONFIG_PATH="/usr/pkg/lib/pkgconfig:/usr/X11R7/lib/pkgconfig"
            cmake -S . -B build-netbsd-x11-apps -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DOPENSSL_ROOT_DIR=/usr/pkg \
              -DCMAKE_PREFIX_PATH="/usr/pkg;/usr/X11R7" \
              -DLIBRDP_BUILD_TESTS=ON \
              -DLIBRDP_BUILD_EXAMPLES=ON \
              -DLIBRDP_BUILD_VIEWER=ON \
              -DLIBRDP_BUILD_SERVER=ON \
              -DLIBRDP_BUILD_ADMIN=ON \
              -DLIBRDP_BUILD_WORKSPACE=ON \
              -DLIBRDP_ENABLE_WERROR=ON \
              -DLIBRDP_WITH_PIPEWIRE=OFF \
              -DLIBRDP_WITH_PNG=OFF \
              -DLIBRDP_WITH_JPEG=OFF \
              -DLIBRDP_WITH_XSHM=ON \
              -DLIBRDP_WITH_XRANDR=ON \
              -DLIBRDP_WITH_PAM=ON \
              -DLIBRDP_WITH_BSDAUTH=OFF
            cmake --build build-netbsd-x11-apps --parallel
            ctest --test-dir build-netbsd-x11-apps --output-on-failure

  netbsd-core-no-viewer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test in NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            export PKG_PATH="https://ftp.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r)/All/"
            pkg_add cmake ninja-build pkgconf openssl libiconv python312
            if command -v python3.12 >/dev/null 2>&1 && ! command -v python3 >/dev/null 2>&1; then
              ln -sf /usr/pkg/bin/python3.12 /usr/pkg/bin/python3
            fi
            for package in ffmpeg4 openh264 pcsc-lite libusb1 libfido2 libcbor cups libarchive; do
              pkg_add "${package}" || true
            done
          run: |
            cmake -S . -B build-netbsd-core-no-viewer -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DOPENSSL_ROOT_DIR=/usr/pkg \
              -DCMAKE_PREFIX_PATH=/usr/pkg \
              -DLIBRDP_BUILD_TESTS=ON \
              -DLIBRDP_BUILD_EXAMPLES=ON \
              -DLIBRDP_BUILD_VIEWER=OFF \
              -DLIBRDP_BUILD_SERVER=OFF \
              -DLIBRDP_BUILD_ADMIN=OFF \
              -DLIBRDP_BUILD_WORKSPACE=OFF \
              -DLIBRDP_ENABLE_WERROR=ON \
              -DLIBRDP_WITH_PIPEWIRE=OFF \
              -DLIBRDP_WITH_PNG=OFF \
              -DLIBRDP_WITH_JPEG=OFF \
              -DLIBRDP_WITH_XSHM=OFF \
              -DLIBRDP_WITH_XRANDR=OFF
            cmake --build build-netbsd-core-no-viewer --parallel
            ctest --test-dir build-netbsd-core-no-viewer --output-on-failure

  netbsd-core-no-backends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test in NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            export PKG_PATH="https://ftp.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r)/All/"
            pkg_add cmake ninja-build pkgconf openssl libiconv python312
            if command -v python3.12 >/dev/null 2>&1 && ! command -v python3 >/dev/null 2>&1; then
              ln -sf /usr/pkg/bin/python3.12 /usr/pkg/bin/python3
            fi
          run: |
            cmake -S . -B build-netbsd-core-no-backends -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DOPENSSL_ROOT_DIR=/usr/pkg \
              -DCMAKE_PREFIX_PATH=/usr/pkg \
              -DLIBRDP_BUILD_TESTS=ON \
              -DLIBRDP_BUILD_EXAMPLES=ON \
              -DLIBRDP_BUILD_VIEWER=OFF \
              -DLIBRDP_BUILD_SERVER=OFF \
              -DLIBRDP_BUILD_ADMIN=OFF \
              -DLIBRDP_BUILD_WORKSPACE=OFF \
              -DLIBRDP_ENABLE_WERROR=ON \
              -DLIBRDP_WITH_FFMPEG_AVC=OFF \
              -DLIBRDP_WITH_OPENH264_AVC=OFF \
              -DLIBRDP_WITH_PCSC=OFF \
              -DLIBRDP_WITH_LIBUSB=OFF \
              -DLIBRDP_WITH_FIDO2=OFF \
              -DLIBRDP_WITH_CBOR=OFF \
              -DLIBRDP_WITH_CUPS=OFF \
              -DLIBRDP_WITH_ACL=OFF \
              -DLIBRDP_WITH_ATTR=OFF \
              -DLIBRDP_WITH_ARCHIVE=OFF \
              -DLIBRDP_WITH_CURL=OFF \
              -DLIBRDP_WITH_LIBXML2=OFF \
              -DLIBRDP_WITH_CAIRO=OFF \
              -DLIBRDP_WITH_QUARTZ=OFF \
              -DLIBRDP_WITH_PIPEWIRE=OFF \
              -DLIBRDP_WITH_PNG=OFF \
              -DLIBRDP_WITH_JPEG=OFF \
              -DLIBRDP_WITH_XSHM=OFF \
              -DLIBRDP_WITH_XRANDR=OFF
            cmake --build build-netbsd-core-no-backends --parallel
            ctest --test-dir build-netbsd-core-no-backends --output-on-failure
