name: build-freebsd

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd-core-no-viewer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake ninja pkgconf openssl libiconv python3 doxygen graphviz
            for package in ffmpeg openh264 pcsc-lite libusb libfido2 libcbor cups libarchive; do
              pkg install -y "${package}" || true
            done
          run: |
            openssl_root=
            openssl_bin=
            for candidate_root in /usr/local /usr; do
              candidate_bin="${candidate_root}/bin/openssl"
              candidate_modules="${candidate_root}/lib/ossl-modules"
              if [ -x "${candidate_bin}" ] && [ -f "${candidate_modules}/legacy.so" ] &&
                 "${candidate_bin}" list -digest-algorithms -provider-path "${candidate_modules}" -provider default -provider legacy | grep -Eq '(^|[[:space:]])MD4([[:space:]]|$)' &&
                 "${candidate_bin}" list -cipher-algorithms -provider-path "${candidate_modules}" -provider default -provider legacy | grep -Eq '(^|[[:space:]])RC4([[:space:]]|$)'; then
                openssl_root="${candidate_root}"
                openssl_bin="${candidate_bin}"
                export OPENSSL_MODULES="${candidate_modules}"
                break
              fi
            done
            if [ -z "${openssl_bin}" ]; then
              echo "No OpenSSL legacy provider exposing MD4 and RC4 was found." >&2
              find /usr/local /usr -name legacy.so -print >&2 || true
              exit 1
            fi
            echo "Using OpenSSL binary: ${openssl_bin}"
            echo "Using OpenSSL provider path: ${OPENSSL_MODULES}"
            "${openssl_bin}" list -providers -provider-path "${OPENSSL_MODULES}" -provider default -provider legacy
            cmake -S . -B build-freebsd-core-no-viewer -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DOPENSSL_ROOT_DIR="${openssl_root}" \
              -DCMAKE_PREFIX_PATH=/usr/local \
              -DLIBRDP_BUILD_TESTS=ON \
              -DLIBRDP_BUILD_EXAMPLES=ON \
              -DLIBRDP_BUILD_X11_VIEWER=OFF \
              -DLIBRDP_BUILD_X11_ADMIN=OFF \
              -DLIBRDP_BUILD_X11_WORKSPACE=OFF \
              -DLIBRDP_ENABLE_WERROR=ON \
              -DLIBRDP_WITH_PIPEWIRE=OFF \
              -DLIBRDP_WITH_PNG=OFF \
              -DLIBRDP_WITH_JPEG=OFF \
              -DLIBRDP_WITH_XSHM=OFF \
              -DLIBRDP_WITH_XRANDR=OFF
            cmake --build build-freebsd-core-no-viewer --parallel
            ctest --test-dir build-freebsd-core-no-viewer --output-on-failure

  freebsd-core-no-backends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test in FreeBSD
