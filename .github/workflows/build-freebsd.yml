name: build-freebsd

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd-core-no-viewer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake ninja pkgconf openssl libiconv python3 doxygen graphviz
            for package in ffmpeg openh264 pcsc-lite libusb libfido2 libcbor cups libarchive; do
              pkg install -y "${package}" || true
            done
          run: |
            cmake -S . -B build-freebsd-core-no-viewer -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DOPENSSL_ROOT_DIR=/usr/local \
              -DCMAKE_PREFIX_PATH=/usr/local \
              -DLIBRDP_BUILD_TESTS=ON \
              -DLIBRDP_BUILD_EXAMPLES=ON \
              -DLIBRDP_BUILD_X11_VIEWER=OFF \
              -DLIBRDP_BUILD_X11_ADMIN=OFF \
              -DLIBRDP_ENABLE_WERROR=ON \
              -DLIBRDP_WITH_PIPEWIRE=OFF \
              -DLIBRDP_WITH_JPEG=OFF \
              -DLIBRDP_WITH_XSHM=OFF \
              -DLIBRDP_WITH_XRANDR=OFF
            cmake --build build-freebsd-core-no-viewer --parallel
            ctest --test-dir build-freebsd-core-no-viewer --output-on-failure

  freebsd-core-no-backends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake ninja pkgconf openssl libiconv python3 doxygen graphviz
          run: |
            cmake -S . -B build-freebsd-core-no-backends -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DOPENSSL_ROOT_DIR=/usr/local \
              -DCMAKE_PREFIX_PATH=/usr/local \
              -DLIBRDP_BUILD_TESTS=ON \
              -DLIBRDP_BUILD_EXAMPLES=ON \
              -DLIBRDP_BUILD_X11_VIEWER=OFF \
              -DLIBRDP_BUILD_X11_ADMIN=OFF \
              -DLIBRDP_ENABLE_WERROR=ON \
              -DLIBRDP_WITH_FFMPEG_AVC=OFF \
              -DLIBRDP_WITH_OPENH264_AVC=OFF \
              -DLIBRDP_WITH_PCSC=OFF \
              -DLIBRDP_WITH_LIBUSB=OFF \
              -DLIBRDP_WITH_FIDO2=OFF \
              -DLIBRDP_WITH_CBOR=OFF \
              -DLIBRDP_WITH_CUPS=OFF \
              -DLIBRDP_WITH_ACL=OFF \
              -DLIBRDP_WITH_ATTR=OFF \
              -DLIBRDP_WITH_ARCHIVE=OFF \
              -DLIBRDP_WITH_PIPEWIRE=OFF \
              -DLIBRDP_WITH_JPEG=OFF \
              -DLIBRDP_WITH_XSHM=OFF \
              -DLIBRDP_WITH_XRANDR=OFF
            cmake --build build-freebsd-core-no-backends --parallel
            ctest --test-dir build-freebsd-core-no-backends --output-on-failure
