name: build-pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r docs/requirements.txt

      - name: Check documentation
        run: python3 scripts/check-docs.py

      - name: Check public API documentation
        run: python3 scripts/check-public-api-docs.py

      - name: Check documented examples
        run: python3 scripts/check-examples.py

      - name: Build Doxygen API reference
        run: python3 scripts/check-doxygen.py

      - name: Build MkDocs site
        run: mkdocs build --strict --site-dir _site

      - name: Add Doxygen HTML to site
        run: mkdir -p _site/api/doxygen && cp -R build/doxygen/html _site/api/doxygen/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
