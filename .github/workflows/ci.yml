name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libssl-dev libavcodec-dev libavutil-dev libswscale-dev doxygen

      - name: Configure
        run: cmake -S . -B build -DLIBRDP_BUILD_TESTS=ON -DLIBRDP_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-no-avc-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libssl-dev doxygen

      - name: Configure without AVC backends
        run: cmake -S . -B build-no-avc -DLIBRDP_BUILD_TESTS=ON -DLIBRDP_BUILD_EXAMPLES=ON -DLIBRDP_WITH_FFMPEG_AVC=OFF -DLIBRDP_WITH_OPENH264_AVC=OFF

      - name: Build
        run: cmake --build build-no-avc -j$(nproc)

      - name: Test
        run: ctest --test-dir build-no-avc --output-on-failure
