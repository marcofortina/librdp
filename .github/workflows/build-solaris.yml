name: build-solaris

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solaris-x11-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test available X11 applications in Solaris
        uses: vmactions/solaris-vm@v1
        with:
          release: "11.4-gcc-14"
          usesh: true
          prepare: |
            export PATH=/usr/bin:/usr/sbin:/usr/gnu/bin:${PATH}
            pkg install --accept \
              developer/build/pkg-config \
              library/security/openssl-3/legacy-provider \
              x11/library/libxau \
              x11/library/libxcomposite \
              x11/library/libxcursor \
              x11/library/libxdamage \
              x11/library/libxfixes \
              x11/library/libxkbcommon \
              x11/library/libxrandr \
              x11/library/libxtst \
              x11/server/xvfb
            command -v cmake
            command -v gcc
            command -v pkg-config
            command -v Xvfb
            test -f /usr/openssl/3/lib/64/ossl-modules/legacy.so
            test -f /usr/include/X11/Xlib.h
            test -f /usr/include/X11/Xcursor/Xcursor.h
          run: |
            export PATH=/usr/bin:/usr/sbin:/usr/gnu/bin:${PATH}
            export CC=/usr/bin/gcc
            export PKG_CONFIG_PATH=/usr/openssl/3/lib/pkgconfig
            cmake -S . -B build-solaris-x11-apps \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_PREFIX_PATH=/usr/openssl/3 \
              -DOPENSSL_ROOT_DIR=/usr/openssl/3 \
              -DLIBRDP_BUILD_TESTS=ON \
              -DLIBRDP_BUILD_EXAMPLES=OFF \
              -DLIBRDP_BUILD_VIEWER=ON \
              -DLIBRDP_BUILD_SERVER=ON \
              -DLIBRDP_BUILD_ADMIN=ON \
              -DLIBRDP_BUILD_WORKSPACE=ON \
              -DLIBRDP_ENABLE_WERROR=ON
            cmake --build build-solaris-x11-apps --parallel
            ctest --test-dir build-solaris-x11-apps \
              -R '^(admin_cli|viewer_cli|x11_viewer_.*|workspace_cli|server_cli|x11_managed.*|x11_server|app_install_layout)$' \
              --output-on-failure

  solaris-core-no-viewer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test in Solaris
        uses: vmactions/solaris-vm@v1
        with:
          release: "11.4-gcc-14"
          usesh: true
          prepare: |
            export PATH=/usr/bin:/usr/sbin:/usr/gnu/bin:${PATH}
            pkg install --accept library/security/openssl-3/legacy-provider
            command -v cmake
            command -v gcc
            test -f /usr/openssl/3/lib/64/ossl-modules/legacy.so
          run: |
            export PATH=/usr/bin:/usr/sbin:/usr/gnu/bin:${PATH}
            export CC=/usr/bin/gcc
            export PKG_CONFIG_PATH=/usr/openssl/3/lib/pkgconfig
            cmake -S . -B build-solaris-core-no-viewer \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_PREFIX_PATH=/usr/openssl/3 \
              -DOPENSSL_ROOT_DIR=/usr/openssl/3 \
              -DLIBRDP_BUILD_TESTS=ON \
              -DLIBRDP_BUILD_EXAMPLES=OFF \
              -DLIBRDP_BUILD_VIEWER=OFF \
              -DLIBRDP_BUILD_SERVER=OFF \
              -DLIBRDP_BUILD_ADMIN=OFF \
              -DLIBRDP_BUILD_WORKSPACE=OFF \
              -DLIBRDP_ENABLE_WERROR=ON
            cmake --build build-solaris-core-no-viewer --parallel
            ctest --test-dir build-solaris-core-no-viewer -R '^(common|core|protocol|transport)$' --output-on-failure

  solaris-core-no-backends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test in Solaris
        uses: vmactions/solaris-vm@v1
        with:
          release: "11.4-gcc-14"
          usesh: true
          prepare: |
            export PATH=/usr/bin:/usr/sbin:/usr/gnu/bin:${PATH}
            pkg install --accept library/security/openssl-3/legacy-provider
            command -v cmake
            command -v gcc
            test -f /usr/openssl/3/lib/64/ossl-modules/legacy.so
          run: |
            export PATH=/usr/bin:/usr/sbin:/usr/gnu/bin:${PATH}
            export CC=/usr/bin/gcc
            export PKG_CONFIG_PATH=/usr/openssl/3/lib/pkgconfig
            cmake -S . -B build-solaris-core-no-backends \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_PREFIX_PATH=/usr/openssl/3 \
              -DOPENSSL_ROOT_DIR=/usr/openssl/3 \
              -DLIBRDP_BUILD_TESTS=ON \
              -DLIBRDP_BUILD_EXAMPLES=OFF \
              -DLIBRDP_BUILD_VIEWER=OFF \
              -DLIBRDP_BUILD_SERVER=OFF \
              -DLIBRDP_BUILD_ADMIN=OFF \
              -DLIBRDP_BUILD_WORKSPACE=OFF \
              -DLIBRDP_ENABLE_WERROR=ON \
              -DLIBRDP_WITH_FFMPEG_AVC=OFF \
              -DLIBRDP_WITH_OPENH264_AVC=OFF \
              -DLIBRDP_WITH_PCSC=OFF \
              -DLIBRDP_WITH_LIBUSB=OFF \
              -DLIBRDP_WITH_FIDO2=OFF \
              -DLIBRDP_WITH_CBOR=OFF \
              -DLIBRDP_WITH_CUPS=OFF \
              -DLIBRDP_WITH_ACL=OFF \
              -DLIBRDP_WITH_ATTR=OFF \
              -DLIBRDP_WITH_ARCHIVE=OFF \
              -DLIBRDP_WITH_CURL=OFF \
              -DLIBRDP_WITH_LIBXML2=OFF \
              -DLIBRDP_WITH_CAIRO=OFF \
              -DLIBRDP_WITH_QUARTZ=OFF \
              -DLIBRDP_WITH_PIPEWIRE=OFF \
              -DLIBRDP_WITH_PNG=OFF \
              -DLIBRDP_WITH_JPEG=OFF \
              -DLIBRDP_WITH_XSHM=OFF \
              -DLIBRDP_WITH_XRANDR=OFF
            cmake --build build-solaris-core-no-backends --parallel
            ctest --test-dir build-solaris-core-no-backends -R '^(common|core|protocol|transport)$' --output-on-failure
