name: build-macos

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-core-no-viewer:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: >
          brew update &&
          brew install
          cmake ninja pkg-config openssl@3 doxygen graphviz
          ffmpeg openh264 pcsc-lite libusb libfido2 libcbor libarchive

      - name: Configure
        run: >
          cmake -S . -B build-macos-core-no-viewer -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DOpenSSL_DIR="$(brew --prefix openssl@3)/lib/cmake/OpenSSL"
          -DLIBRDP_BUILD_TESTS=ON
          -DLIBRDP_BUILD_EXAMPLES=ON
          -DLIBRDP_BUILD_X11_VIEWER=OFF
          -DLIBRDP_BUILD_X11_ADMIN=OFF
          -DLIBRDP_BUILD_X11_WORKSPACE=OFF
          -DLIBRDP_ENABLE_WERROR=ON
          -DLIBRDP_WITH_CAIRO=OFF
          -DLIBRDP_WITH_QUARTZ=ON
          -DLIBRDP_WITH_PIPEWIRE=OFF
          -DLIBRDP_WITH_PNG=OFF
          -DLIBRDP_WITH_JPEG=OFF
          -DLIBRDP_WITH_XSHM=OFF
          -DLIBRDP_WITH_XRANDR=OFF

      - name: Build
        run: cmake --build build-macos-core-no-viewer --parallel

      - name: Test
        run: ctest --test-dir build-macos-core-no-viewer --output-on-failure

  macos-core-no-backends:
    runs-on: macos-latest

    steps:
      - name: Checkout
